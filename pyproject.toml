[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmoresponse"
dynamic = ["version"]
description = "Tools for tracing atmospheric-correction uncertainty into Tanager and EMIT reflectance algorithms."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Paul Peshette" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "geopandas>=0.14",
  "h5py>=3.10",
  "numpy>=1.26",
  "requests>=2.31",
  "shapely>=2.0",
]

[project.optional-dependencies]
live = [
  "earthaccess>=0.10",
  "netCDF4>=1.6",
  "pystac-client>=0.8",
  "requests>=2.31",
  "xarray>=2024.1",
]
geo = [
  "geopandas>=0.14",
  "rasterio>=1.3",
  "shapely>=2.0",
]
plot = [
  "matplotlib>=3.8",
]
report = [
  "reportlab>=4",
  "pillow>=10",
]
test = [
  "pytest>=8",
  "matplotlib>=3.8",
]
notebook = [
  "atmoresponse[plot,live,geo]",
  "jupytext>=1.16",
  "jupyterlab>=4",
]
dev = [
  "atmoresponse[test,live,geo,plot,report,notebook]",
]

[tool.setuptools.dynamic]
version = { attr = "atmoresponse._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"atmoresponse.assets" = ["*.json", "*.md"]
"atmoresponse.assets.endmembers" = ["*.json", "*.npz"]
"atmoresponse.assets.lut" = ["*.json"]
